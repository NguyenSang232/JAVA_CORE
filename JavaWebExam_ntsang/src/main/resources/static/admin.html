<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Boarding Admin</title>
    <link rel="stylesheet" href="style/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>
    <div class="layout">
        <!-- ================= Sidebar ================= -->
		<aside class="sidebar">
		            <div class="logo">🐾</div>
		            <ul>
		                <li>
		                    <a id="menu-dashboard" href="#" class="active" onclick="showDashboard(); return false;">
		                        <i class="fa-solid fa-chart-line"></i>
		                        <span>Dashboard</span>
		                    </a>
		                </li>
		                <li>
		                    <a id="menu-owners" href="#" onclick="showOwners(); return false;">
		                        <i class="fa-solid fa-user"></i>
		                        <span>Owners</span>
		                    </a>
		                </li>
		                <li>
		                    <a id="menu-pets" href="#" onclick="showPets(); return false;" >
		                        <i class="fa-solid fa-paw"></i>
		                        <span>Pets</span>
		                    </a>
		                </li>
		                <li>
		                    <a id="menu-orders" href="#" onclick="">
		                        <i class="fa-solid fa-house"></i>
		                        <span>Boardings</span>
		                    </a>
		                </li>
		                <li>
		                    <a id="menu-users" href="#" onclick="">
		                        <i class="fa-solid fa-money-bill"></i>
		                        <span>Revenue</span>
		                    </a>
		                </li>
		                <li>
		                    <a id="menu-logout" href="#">
		                        <i class="fa-solid fa-right-from-bracket"></i>
		                        <span>Logout</span>
		                    </a>
		                </li>
		            </ul>
		        </aside>
        <!-- ================= Content ================= -->
        <main class="content">
			<div id="content"></div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
