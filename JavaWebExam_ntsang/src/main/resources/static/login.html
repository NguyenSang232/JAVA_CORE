<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pet Boarding Login</title>

    <link rel="stylesheet" href="style/login.css">

</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="logo">
            🐾
        </div>
        <h1>
            Pet Boarding
        </h1>
        <p class="subtitle">
            Pet care management system
        </p>
        <form action="/login" method="post">
            <div class="input-group">
                <label>
                    Phone Number
                </label>
                <input 
                    type="text"
                    id="username"
					name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>
            <div class="input-group">
                <label>
                    Password
                </label>
                <input 
                    type="password"
                    id="password"
					name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
            </div>
          <button type="submit">
                Login
            </button>
            <p id="message"></p>
        </form>
        <div class="footer">
            <span>
                🐶 Caring pets, happy owners
            </span>
        </div>
    </div>
</div>
<script src="js/login.js"></script>
</body>

</html>
