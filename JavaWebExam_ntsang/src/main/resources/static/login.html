<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pet Boarding Login</title>
    <link rel="stylesheet" href="style/login.css">
</head>
<body>
<div class="container">
    <div class="login-card">
        <div class="logo">
            🐾
        </div>
        <h1>
            Pet Boarding
        </h1>
        <p class="subtitle">
            Hệ thống quản lý khách sạn thú cưng chuyên nghiệp
        </p>
        <form action="/login" method="post">
            <div id="error-message" class="alert-error">
        ⚠️ Sai số điện thoại hoặc mật khẩu. Vui lòng thử lại!
            </div>
            <div class="input-group">
                <label>
                    Phone Number
                </label>
                <input 
                    type="text"
                    id="username"
					name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>
            <div class="input-group">
                <label>
                    Password
                </label>
                <input 
                    type="password"
                    id="password"
					name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>
            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
            </div>
            <button type="submit">
                Login
            </button>
            <p id="message"></p>
        </form>
        <div class="footer">
            <span>
                🌟 Nơi yêu thương thú cưng của bạn được chăm sóc trọn vẹn
            </span>
        </div>
    </div>
</div>
</body>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
        const errorDiv = document.getElementById('error-message');
        if (errorDiv) {
            errorDiv.style.display = 'block';
            if (window.history.replaceState) {
                const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
                window.history.replaceState({path: cleanUrl}, '', cleanUrl);
            }
        }
    }
</script>
</html>
